<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite de casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#12211b;--bg2:#0c1612;--iv:#f1ead9;--tc:#d98b6a;--tc2:#b0613f;--mo:#9db39a;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;
box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#050a08;color:var(--iv);font-family:var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--tc);outline-offset:3px}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
#page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;scroll-behavior:smooth}

/* cenas */
.sc{position:relative;min-height:100dvh;padding:92px 30px 76px;display:flex;flex-direction:column;justify-content:center;scroll-snap-align:start;overflow:hidden}
.sc.dk2{background:var(--bg2)}
.sc.iv{background:var(--iv);color:#17281f}
.eyebrow{margin:0 0 18px;font:500 .72rem/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--tc)}
.iv .eyebrow{color:var(--tc2)}
h2.t{margin:0 0 22px;font:300 italic 2.7rem/1.05 var(--serif)}
.sc p{margin:0 0 14px;font-size:1.05rem;line-height:1.6;font-weight:300}
.mut{color:var(--mo)}
.iv .mut{color:#5b6e60}
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*.13s)}
#app.opened .sc.in .rv{opacity:1;transform:none}
#s1 .rv{transition-delay:calc(1.2s + var(--i,0)*.16s)}

/* capa */
.hero{justify-content:flex-end;padding-bottom:120px}
.bg{position:absolute;inset:0;background:var(--photo) 50% 12%/cover no-repeat;filter:grayscale(1) contrast(1.05) brightness(.85)}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s;filter:saturate(.85) brightness(.8)}
.vid.on{opacity:1}
.shade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 6%,rgba(18,33,27,.7) 38%,rgba(18,33,27,.25) 75%,rgba(18,33,27,.45))}
.hc{position:relative}
.big{margin:0;font:300 italic clamp(3.6rem,19vw,5.4rem)/.92 var(--serif)}
.big span{display:block}
.big i{color:var(--tc);margin-right:.12em}
.date{margin-top:24px!important;font:400 .85rem var(--sans)!important;letter-spacing:.32em}
.cue{position:absolute;left:30px;bottom:30px;z-index:2;background:none;border:0;display:flex;align-items:center;gap:12px;cursor:pointer;font:500 .7rem var(--sans);letter-spacing:.28em;text-transform:uppercase}
.cue b{position:relative;width:1px;height:46px;background:rgba(241,234,217,.3);overflow:hidden}
.cue b::after{content:"";position:absolute;left:0;top:-14px;width:1px;height:14px;background:var(--tc);animation:drip 2.2s ease-in-out infinite}
@keyframes drip{to{top:46px}}

/* contagem */
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:30px 18px;margin-top:26px}
.cnt div{border-top:1px solid rgba(241,234,217,.22);padding-top:12px}
.cnt b{display:block;font:300 italic 4.2rem/1 var(--serif);font-variant-numeric:tabular-nums}
.cnt span{font:500 .68rem var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--mo)}

/* programa */
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:22px 0;border-top:1px solid rgba(23,40,31,.22)}
.tl time{font:300 italic 1.9rem/1 var(--serif);color:var(--tc2)}
.tl strong{display:block;font:500 1.05rem var(--sans);letter-spacing:.04em}
.tl small{font-size:.95rem;color:#5b6e60}

/* local */
.topo{position:absolute;right:-90px;top:60px;width:340px;opacity:.16;pointer-events:none}
.venue{margin:0 0 8px;font:300 italic 2.5rem/1.05 var(--serif)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 26px}
.pill{display:inline-block;padding:13px 20px;border:1px solid currentColor;border-radius:999px;background:none;color:var(--iv);font:500 .76rem var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s}
.pill:hover{background:var(--iv);color:var(--bg)}
.pill.fill{background:var(--tc);border-color:var(--tc);color:var(--bg2)}
.pill.fill:hover{background:var(--iv);border-color:var(--iv)}
.sub{margin:6px 0 4px;font:500 .72rem var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--tc)}

/* presença */
.form{display:grid;gap:20px;margin-top:6px}
label{display:grid;gap:4px;font:500 .7rem var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mo)}
input,select,textarea{background:transparent;border:0;border-bottom:1px solid rgba(241,234,217,.4);border-radius:0;padding:8px 0;font:300 1.2rem var(--serif);color:var(--iv);letter-spacing:0;text-transform:none}
select option{color:#111}
textarea{min-height:64px;resize:vertical}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch .pill{padding:13px 6px;text-align:center}
.ch .pill.on{background:var(--tc);border-color:var(--tc);color:var(--bg2)}
.note{min-height:1.4em;margin:0!important;font:italic 1rem var(--serif)!important;color:var(--tc)}
.end{text-align:center}
.end .big{font-size:3rem}
.end .big span{display:inline}
.replay{margin-top:26px;background:none;border:0;color:var(--mo);font:italic 1rem var(--serif);text-decoration:underline;cursor:pointer}

/* navegação */
.dots{position:absolute;z-index:20;right:12px;top:50%;translate:0 -50%;display:grid;gap:12px;mix-blend-mode:difference;opacity:0;transition:opacity 1s ease 2s}
#app.opened .dots{opacity:1}
.dots i{display:block;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.35;transition:opacity .4s,transform .4s;cursor:pointer}
.dots i.on{opacity:1;transform:scale(1.6)}
.snd{position:absolute;z-index:20;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:42px;height:42px;border-radius:50%;border:1px solid #fff;background:none;mix-blend-mode:difference;display:none;place-items:center;cursor:pointer;opacity:0;transition:opacity 1s ease 2s}
#app.opened .snd.show{display:grid;opacity:1}
.snd svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.snd .x{display:none}.snd.off .w{display:none}.snd.off .x{display:block}

/* cortinas */
#curtain{position:absolute;inset:0;z-index:50;overflow:hidden}
#curtain.open{visibility:hidden;pointer-events:none;transition:visibility 0s linear 2.6s}
.pnl{position:absolute;top:0;bottom:0;width:50.6%;transition:transform 2.1s cubic-bezier(.72,0,.18,1);will-change:transform;
background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.07) 30%,rgba(0,0,0,.38) 62%,rgba(255,255,255,.05)),repeating-linear-gradient(90deg,#25493a 0 28px,#173227 28px 56px)}
.pnl.l{left:0;transform-origin:0 50%;box-shadow:inset -24px 0 36px rgba(0,0,0,.5)}
.pnl.r{right:0;transform-origin:100% 50%;box-shadow:inset 24px 0 36px rgba(0,0,0,.5)}
#curtain.open .pnl{transform:scaleX(.1)}
.val{position:absolute;top:0;left:0;right:0;height:54px;z-index:3;background:linear-gradient(#070e0b,#173227);box-shadow:0 8px 20px rgba(0,0,0,.5);transition:transform 1.4s ease .5s}
#curtain.open .val{transform:translateY(-110%)}
.cover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;transition:opacity .7s ease,transform 1.2s ease}
#curtain.open .cover{opacity:0;transform:scale(1.1)}
.cover .eyebrow{color:#e9c9b6}
.cover h1{margin:0;font:300 italic 3.6rem/1 var(--serif);text-shadow:0 2px 18px rgba(0,0,0,.5)}
.cover h1 i{display:block;font-size:1.8rem;color:var(--tc);margin:6px 0}
.cover .cd{margin:22px 0 46px;font:400 .85rem var(--sans);letter-spacing:.32em}
.open-btn{position:relative;width:96px;height:96px;border-radius:50%;border:1px solid var(--iv);background:rgba(12,22,18,.35);font:500 .72rem var(--sans);letter-spacing:.26em;text-transform:uppercase;cursor:pointer;transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
.open-btn:hover{transform:scale(1.06)}
.open-btn::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(241,234,217,.6);animation:ping 2.6s ease-out infinite}
@keyframes ping{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important;transition-delay:0s!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
// ============ EDITA AQUI ============
var CFG = {
  a: "Juliette", b: "James",
  start: "2027-06-12T15:00:00+02:00", durationH: 9,   // fuso de Maputo: +02:00
  dateShort: "12 · 06 · 2027",
  dateLong: "Sábado, 12 de junho de 2027",
  invite: "Juliette e James têm a alegria de te convidar para celebrar o seu casamento.",
  venue: "Nome do local", address: "Rua, cidade, país",
  dress: "Traje: gala (black tie)",
  rsvpBy: "Pedimos que confirmes até 12 de maio de 2027.",
  whatsapp: "258840000000", email: "casamento@exemplo.com",
  schedule: [["15:00","Cerimónia","Chegada dos convidados às 14:30"],["17:00","Cocktail","Jardim do local"],["19:00","Jantar",""],["21:30","Festa","Até ao amanhecer"]],
  video: "",   // vídeo da capa, ex.: "capa.mp4" ou um URL (mp4, curto, sem som necessário)
  music: "",   // música, ex.: "musica.mp3" ou um URL
};
var $ = function (id) { return document.getElementById(id); };
var app = $("app"), page = $("page"), curtain = $("curtain");

document.title = CFG.a + " & " + CFG.b;
document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = CFG[el.dataset.t]; });
$("tl").innerHTML = CFG.schedule.map(function (r) {
  return "<li><time>" + r[0] + "</time><div><strong>" + r[1] + "</strong>" + (r[2] ? "<small>" + r[2] + "</small>" : "") + "</div></li>";
}).join("");

// Vídeo e música
var vid = $("bgVideo"), mus = $("music"), snd = $("snd");
function setVideo(src) {
  vid.src = src; vid.hidden = false;
  vid.addEventListener("canplay", function () { vid.classList.add("on"); }, { once: true });
  vid.load();
  if (curtain.classList.contains("open")) vid.play().catch(function () {});
}
function setMusic(src) { mus.src = src; snd.classList.add("show"); }
function startMedia() {
  if (vid.src) vid.play().catch(function () {});
  if (mus.src) {
    mus.volume = 0; mus.play().catch(function () {});
    var v = 0, t = setInterval(function () { v = Math.min(0.7, v + 0.05); mus.volume = v; if (v >= 0.7) clearInterval(t); }, 120);
  }
}
snd.addEventListener("click", function () { mus.muted = !mus.muted; snd.classList.toggle("off", mus.muted); });
if (CFG.video) setVideo(CFG.video);
if (CFG.music) setMusic(CFG.music);

// Cortinas
$("open").addEventListener("click", function () {
  startMedia();
  curtain.classList.add("open"); app.classList.add("opened");
});
$("replay").addEventListener("click", function () {
  page.style.scrollBehavior = "auto"; page.scrollTop = 0; page.style.scrollBehavior = "";
  curtain.classList.remove("open"); app.classList.remove("opened");
  try { mus.pause(); vid.pause(); } catch (err) {}
});
$("cue").addEventListener("click", function () { $("s2").scrollIntoView({ behavior: "smooth" }); });

// Cenas: entrada suave e pontos de navegação
var scenes = Array.prototype.slice.call(document.querySelectorAll(".sc")), dots = $("dots");
scenes.forEach(function (sc, n) {
  sc.querySelectorAll(".rv").forEach(function (el, i) { el.style.setProperty("--i", i); });
  var d = document.createElement("i"); d.addEventListener("click", function () { sc.scrollIntoView({ behavior: "smooth" }); }); dots.appendChild(d);
});
var dotEls = dots.children;
if ("IntersectionObserver" in window) {
  var ioIn = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) e.target.classList.add("in"); }); }, { root: page, threshold: 0.2 });
  var ioAct = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { var n = scenes.indexOf(e.target); for (var k = 0; k < dotEls.length; k++) dotEls[k].classList.toggle("on", k === n); } });
  }, { root: page, threshold: 0.55 });
  scenes.forEach(function (sc) { ioIn.observe(sc); ioAct.observe(sc); });
} else { scenes.forEach(function (sc) { sc.classList.add("in"); }); }

// Contagem
var target = new Date(CFG.start).getTime();
function tick() {
  var d = target - Date.now();
  if (d <= 0) { $("cnt").innerHTML = "<div style='grid-column:1/-1'><b>Hoje!</b></div>"; return; }
  var v = [[Math.floor(d / 864e5), "dias"], [Math.floor(d % 864e5 / 36e5), "horas"], [Math.floor(d % 36e5 / 6e4), "minutos"], [Math.floor(d % 6e4 / 1e3), "segundos"]];
  $("cnt").innerHTML = v.map(function (x) { return "<div><b>" + x[0] + "</b><span>" + x[1] + "</span></div>"; }).join("");
}
tick(); setInterval(tick, 1000);

// Mapas e calendário
var q = encodeURIComponent(CFG.venue + ", " + CFG.address);
$("mGoogle").href = "https://www.google.com/maps/search/?api=1&query=" + q;
$("mApple").href = "https://maps.apple.com/?q=" + q;
$("mWaze").href = "https://waze.com/ul?q=" + q + "&navigate=yes";
var s0 = new Date(CFG.start), e0 = new Date(s0.getTime() + CFG.durationH * 36e5);
var fmt = function (d) { return d.toISOString().replace(/[-:]|\.\d{3}/g, ""); };
var ttl = encodeURIComponent("Casamento " + CFG.a + " & " + CFG.b);
$("cGoogle").href = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + ttl + "&dates=" + fmt(s0) + "/" + fmt(e0) + "&location=" + q;
$("cOutlook").href = "https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject=" + ttl + "&startdt=" + encodeURIComponent(s0.toISOString()) + "&enddt=" + encodeURIComponent(e0.toISOString()) + "&location=" + q;

// Presença
var answer = "";
document.querySelectorAll(".ch .pill").forEach(function (b) {
  b.addEventListener("click", function () {
    answer = b.dataset.v;
    document.querySelectorAll(".ch .pill").forEach(function (x) { x.classList.toggle("on", x === b); });
  });
});
function rsvpText() {
  var name = $("fName").value.trim();
  if (!name || !answer) { $("note").textContent = "Indica o teu nome e se podes vir."; return null; }
  $("note").textContent = "";
  var t = "Olá! Sou " + name + ". " + (answer === "yes" ? "Confirmo a minha presença no casamento de " + CFG.a + " e " + CFG.b + " (" + $("fGuests").value + " pessoa(s))." : "Infelizmente não poderei estar no casamento de " + CFG.a + " e " + CFG.b + ".");
  var m = $("fMsg").value.trim();
  return m ? t + " " + m : t;
}
$("sendWa").addEventListener("click", function () {
  var t = rsvpText(); if (t) window.open("https://wa.me/" + CFG.whatsapp + "?text=" + encodeURIComponent(t), "_blank", "noopener");
});
$("sendMail").addEventListener("click", function () {
  var t = rsvpText(); if (t) window.location.href = "mailto:" + CFG.email + "?subject=" + encodeURIComponent("Presença · " + CFG.a + " & " + CFG.b) + "&body=" + encodeURIComponent(t);
});
</script>
